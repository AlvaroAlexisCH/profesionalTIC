name: CI/CD - Calculadora HTML JavaScript - AWS S3

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Validar HTML
        run: npm run lint:html

      - name: Validar JavaScript
        run: npm run check:js

      - name: Ejecutar pruebas
        run: npm test

      - name: Preparar artefacto (Build)
        run: npm run build

      - name: Publicar artefacto del build
        uses: actions/upload-artifact@v4
        with:
          name: sitio-web
          path: dist/

      # =======================================================
      # DESPLIEGUE REAL EN AWS S3 (CD)
      # =======================================================
      - name: Configurar credenciales de AWS
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Desplegar sitio web en Amazon S3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          aws s3 sync dist/ s3://alexis-prueba1 --delete